# Better colors
set -ga terminal-overrides ",xterm-256color:Tc"

# Mouse support
set -g mouse on
set -sg escape-time 0

# Remap leader
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1 instead 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Move current window to the target index if free,
# otherwise swap it with the window at that index
bind . command-prompt -p "swap with:" {
  if -F "#{W:#{?#{==:#{window_index},%%},1,}}" {
    swap-window -t "%%" ; select-window -t "%%"
  } {
    move-window -t "%%"
  }
}

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Clipboard integration (Wayland, needs wl-clipboard)
# y: copy selection to tmux buffer AND system clipboard, then leave copy mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
# Mouse: releasing a drag selection copies it to the system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
# prefix + C-v: paste from the system clipboard into the pane
bind-key C-v run-shell "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
